name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          test "$(uname -m)" = arm64
          swift --version
      - name: Lint
        run: swift format lint --strict --recursive Package.swift Sources Tests
      - name: Tests
        run: swift test -Xswiftc -warnings-as-errors
      - name: Build Apple Silicon executable
        run: swift build --configuration release --arch arm64 -Xswiftc -warnings-as-errors
      - name: Package executable
        shell: bash
        run: |
          bin_dir="$(swift build --configuration release --arch arm64 --show-bin-path)"
          test "$(lipo -archs "$bin_dir/rf4")" = arm64
          codesign --force --sign - "$bin_dir/rf4"
          codesign --verify --strict "$bin_dir/rf4"
          "$bin_dir/rf4" --help
          mkdir -p .build/artifacts
          tar -C "$bin_dir" -czf "$PWD/.build/artifacts/rf4-macos-arm64.tar.gz" rf4
      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rf4-macos-arm64
          path: .build/artifacts/rf4-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
